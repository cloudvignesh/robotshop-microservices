apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: robot-shop-route
  namespace: web-app
spec:
  parentRefs:
  - name: gateway-01
    namespace: web-app
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: web
      port: 8080
      weight: 1